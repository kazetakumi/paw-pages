[project]
name = "ocr-engine"
version = "0.1.0"
description = "PDF/resume text extraction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_engine"]
