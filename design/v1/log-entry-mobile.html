<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paw Pages — Log an entry (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#13202E;
    --ink-2:#4E5A67;
    --faint:#8D97A1;
    --paper:#F2F3EF;
    --card:#FFFFFF;
    --rule:#DCE0E4;
    --rule-2:#EDEFF1;
    --stamp:#B23A24;
    --seal:#2E6B4F;

    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"Public Sans","Segoe UI",system-ui,sans-serif;
    --data:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#E6E7E2;font-family:var(--body)}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .device{
    position:relative;width:100%;max-width:412px;margin:0 auto;min-height:100vh;
    background:var(--card);color:var(--ink);font-size:15px;line-height:1.5;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
  }
  @media (min-width:520px){
    body{padding:34px 0}
    .device{min-height:844px;height:844px;overflow:hidden;
      border:1px solid #C9CBC5;border-radius:34px;
      box-shadow:0 22px 60px rgba(19,32,46,.16)}
  }

  /* ============ top bar — cancel / title ============ */
  .top{flex:none;display:flex;align-items:center;gap:12px;
    padding:14px 18px 12px;background:var(--paper);border-bottom:1px solid var(--rule)}
  .cancel{font-size:14.5px;color:var(--ink-2)}
  .ttl{font-family:var(--display);font-size:14.5px;font-weight:600;letter-spacing:-.01em;
    position:absolute;left:0;right:0;text-align:center;pointer-events:none}
  .top .spacer{margin-left:auto;width:46px}

  .scroll{flex:1;overflow-y:auto;padding:0 0 118px}

  /* ============ blocks ============ */
  .block{padding:20px 18px;border-bottom:1px solid var(--rule-2)}
  .blabel{font-family:var(--data);font-size:10px;font-weight:700;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink);margin:0 0 13px;
    display:flex;align-items:baseline;gap:8px}
  .blabel .opt{font-weight:400;letter-spacing:.07em;color:var(--faint)}

  .field{border-bottom:1px solid var(--rule);padding-bottom:2px}
  .field:focus-within{border-bottom-color:var(--ink);box-shadow:0 1px 0 0 var(--ink)}
  .field input,.field textarea{width:100%;border:0;background:transparent;padding:9px 0;
    font-family:var(--body);font-size:17px;color:var(--ink);resize:none}
  .field input:focus,.field textarea:focus{outline:none}
  .field input::placeholder,.field textarea::placeholder{color:#B9C0C7}
  .field.date input{font-family:var(--data);font-size:15px}

  /* chips — scroll sideways rather than wrap into a wall */
  .chips{display:flex;gap:7px;margin-top:12px;overflow-x:auto;
    padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip-b{flex:none;font-family:var(--data);font-size:11px;letter-spacing:.04em;
    border:1px solid var(--rule);background:#fff;color:var(--ink-2);
    padding:7px 12px;border-radius:2px}
  .chip-b.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chips .lbl{flex:none;font-family:var(--data);font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);align-self:center;margin-right:2px}

  /* pet picker */
  .pets{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .pets::-webkit-scrollbar{display:none}
  .petb{flex:none;display:flex;align-items:center;gap:9px;padding:7px 14px 7px 7px;
    border:1px solid var(--rule);background:#fff;border-radius:2px;
    font-family:var(--body);font-size:15px;color:var(--ink-2)}
  .petb .av{width:29px;height:29px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink)}
  .petb .av.a{background:#DEE5EA} .petb .av.b{background:#E4E8DE} .petb .av.c{background:#EBDFE0}
  .petb.on{border-color:var(--ink);color:var(--ink);font-weight:600;
    box-shadow:inset 0 0 0 1px var(--ink)}

  .due-block{background:#FAFBF9}
  .due-off{display:flex;align-items:center;gap:9px;margin-top:14px;
    font-size:13.5px;color:var(--ink-2)}
  .due-off input{width:16px;height:16px;accent-color:var(--ink)}

  .consequence{margin-top:16px;border-left:2px solid var(--rule);padding:2px 0 2px 13px;
    font-size:13px;color:var(--ink-2)}
  .consequence b{font-family:var(--data);font-size:11.5px;font-weight:700;color:var(--ink)}

  /* ============ save ============ */
  .save{
    position:absolute;left:18px;right:18px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    background:var(--ink);color:#fff;border:0;border-radius:2px;
    font-family:var(--body);font-size:15px;font-weight:600;padding:15px 18px;
    box-shadow:0 8px 24px rgba(19,32,46,.22);
  }
  .fade{position:absolute;left:0;right:0;bottom:0;height:104px;pointer-events:none;
    background:linear-gradient(to top,var(--card) 42%,rgba(255,255,255,0))}

  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="device">

  <div class="top">
    <a class="cancel" href="dashboard-mobile.html">Cancel</a>
    <span class="ttl">Log an entry</span>
    <span class="spacer"></span>
  </div>

  <form class="scroll" onsubmit="return false">

    <div class="block">
      <p class="blabel">Pet</p>
      <div class="pets">
        <button type="button" class="petb on"><span class="av a">B</span>Biscuit</button>
        <button type="button" class="petb"><span class="av b">M</span>Momo</button>
        <button type="button" class="petb"><span class="av c">P</span>Pepper</button>
      </div>
    </div>

    <div class="block">
      <p class="blabel">What happened</p>
      <div class="field">
        <input type="text" value="Rabies booster" placeholder="Rabies booster, nail trim, limping…">
      </div>
      <div class="chips">
        <span class="lbl">Used</span>
        <button type="button" class="chip-b">Rabies booster</button>
        <button type="button" class="chip-b">Deworming</button>
        <button type="button" class="chip-b">Grooming</button>
        <button type="button" class="chip-b">Vet visit</button>
      </div>
    </div>

    <div class="block">
      <p class="blabel">Date</p>
      <div class="field date"><input type="date" value="2026-08-29"></div>
      <div class="chips">
        <button type="button" class="chip-b on">Today</button>
        <button type="button" class="chip-b">Yesterday</button>
      </div>
    </div>

    <div class="block due-block">
      <p class="blabel">Next one due <span class="opt">optional</span></p>
      <div class="field date"><input type="date" value="2027-08-29"></div>
      <div class="chips">
        <span class="lbl">Set to</span>
        <button type="button" class="chip-b">+1 mo</button>
        <button type="button" class="chip-b">+3 mo</button>
        <button type="button" class="chip-b">+6 mo</button>
        <button type="button" class="chip-b on">+1 yr</button>
        <button type="button" class="chip-b">+3 yr</button>
      </div>
      <label class="due-off"><input type="checkbox"> Nothing due after this</label>
      <div class="consequence">
        <b>29 AUG 2027</b><br>
        This shows under Due &amp; overdue on your home screen and stays there
        until you log the next one. Paw Pages won't email you.
      </div>
    </div>

    <div class="block">
      <p class="blabel">Vet or clinic <span class="opt">optional</span></p>
      <div class="field"><input type="text" placeholder="Dr. Menon, Anvayaa Clinic"></div>
    </div>

    <div class="block">
      <p class="blabel">Notes <span class="opt">optional</span></p>
      <div class="field">
        <textarea rows="3" placeholder="Batch number, how she took it, what the vet said"></textarea>
      </div>
    </div>

  </form>

  <div class="fade"></div>
  <button class="save">Save</button>

</div>

</body>
</html>
