<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paw Pages — Sign In (Mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#13202E;
    --ink-2:#4E5A67;
    --faint:#8D97A1;
    --paper:#F2F3EF;
    --card:#FFFFFF;
    --rule:#DCE0E4;

    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --body:"Public Sans","Segoe UI",system-ui,sans-serif;
    --data:"Space Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:#D7D4C9;font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.55;
    display:flex;justify-content:center;min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  .frame{
    position:relative;width:100%;max-width:390px;background:var(--paper);min-height:100vh;
    display:flex;flex-direction:column;justify-content:center;padding:28px 22px;
    padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  }
  @media (min-width:460px){
    .frame{margin:24px 0;box-shadow:0 0 0 6px #2A2924,0 16px 32px #00000040;border-radius:24px;min-height:0;height:844px}
  }

  .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:28px}
  .brand-mark{
    width:24px;height:24px;border-radius:5px;background:var(--ink);color:#fff;flex:none;
    display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;
  }
  .brand-word{font-family:var(--display);font-weight:700;font-size:14.5px;letter-spacing:.02em}
  .brand-word .p2{color:var(--faint)}

  .sheet{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:26px 22px 22px}
  h1{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;line-height:1.1}
  .lede{font-size:13.5px;color:var(--ink-2);margin:0 0 24px}

  .f{margin-bottom:19px}
  .lab{font-family:var(--data);font-size:9.5px;font-weight:700;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink);display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .lab .aux{margin-left:auto;font-weight:400;letter-spacing:.08em;color:var(--faint);cursor:pointer}
  .field{border-bottom:1px solid var(--rule);padding-bottom:2px}
  .field:focus-within{border-bottom-color:var(--ink);box-shadow:0 1px 0 0 var(--ink)}
  .field input{width:100%;border:0;background:transparent;padding:8px 0;font-family:var(--body);font-size:16px;color:var(--ink)}
  .field input:focus{outline:none}
  .field input::placeholder{color:#B9C0C7}

  .btn{display:flex;align-items:center;justify-content:center;width:100%;
    font-family:var(--body);font-size:14.5px;font-weight:600;
    background:var(--ink);color:#fff;border:1px solid var(--ink);
    padding:13px 18px;border-radius:8px;cursor:pointer;margin-top:4px}

  .alt{text-align:center;margin-top:22px;font-size:13.5px;color:var(--ink-2)}
  .alt a{border-bottom:1px solid var(--rule);padding-bottom:1px;color:var(--ink)}
</style>
</head>
<body>

<div class="frame">
  <a class="brand" href="../landing/mobile.html">
    <span class="brand-mark">P</span>
    <span class="brand-word">Paw<span class="p2">Pages</span></span>
  </a>

  <form class="sheet" onsubmit="return false">
    <h1>Sign in</h1>
    <p class="lede">Welcome back.</p>

    <div class="f">
      <label class="lab" for="em">Email</label>
      <div class="field"><input id="em" type="email" placeholder="you@example.com" autocomplete="email"></div>
    </div>

    <div class="f">
      <label class="lab" for="pw">Password
        <a class="aux" href="#">Forgot?</a></label>
      <div class="field"><input id="pw" type="password" placeholder="Your password" autocomplete="current-password"></div>
    </div>

    <a class="btn" href="../home/mobile.html">Sign in</a>
  </form>

  <p class="alt">New here? <a href="../signup/mobile.html">Create an account</a></p>
</div>

</body>
</html>
